<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: sans-serif; max-width: 500px; margin: 0 auto; border: 1px solid #ddd; border-radius: 10px; }
        .header { background-color: #0d6efd; color: white; text-align: center; padding: 20px; border-radius: 10px 10px 0 0; }
        .otp { font-size: 32px; font-weight: bold; color: #0d6efd; text-align: center; margin: 20px 0; }
        .content { padding: 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1 style="margin:0;">🎓 Student Portal</h1></div>
        <div class="content">
            <p>Hello <strong>{{ name }}</strong>,</p>
            <p>Your secure login OTP is:</p>
            <div class="otp">{{ otp }}</div>
            <p>Valid for 5 minutes.</p>
        </div>
    </div>
</body>
</html>
