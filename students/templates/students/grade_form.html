{% extends 'students/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Enter Grade: {{ enrollment.course }}</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Student: {{ enrollment.student.full_name }}</p>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">Save Grade</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    input, select, textarea { display: block; width: 100%; padding: 0.375rem 0.75rem; border: 1px solid #dee2e6; border-radius: 0.375rem; }
</style>
{% endblock %}
