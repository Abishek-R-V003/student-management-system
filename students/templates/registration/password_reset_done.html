{% extends 'students/base.html' %}

{% block title %}Check Your Email - Student MS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4 text-center p-4">
            <div class="card-body py-5">
                <div class="display-1 text-success mb-3">📩</div>
                <h3 class="fw-bold">Email Sent!</h3>
                <p class="text-muted px-4">
                    We've emailed you a password reset link. If you don't see it, please check your <strong>spam folder</strong>.
                </p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-outline-primary px-4">Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
