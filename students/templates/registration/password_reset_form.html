{% extends 'students/base.html' %}

{% block title %}Reset Password - Student MS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                <h4 class="mb-0 fw-bold">Reset Password</h4>
                <p class="mb-0 opacity-75">Enter your email to recover access</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">✉️</span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                        {% if form.non_field_errors %}
                            <div class="text-danger small mt-2">{{ form.non_field_errors }}</div>
                        {% endif %}
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Send Reset Link</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <a href="{% url 'login' %}" class="text-decoration-none small text-muted">← Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
