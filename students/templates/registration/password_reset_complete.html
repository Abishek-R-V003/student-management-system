{% extends 'students/base.html' %}

{% block title %}Password Changed - Student MS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4 text-center p-4">
            <div class="card-body py-5">
                <div class="display-1 text-primary mb-3">🎉</div>
                <h3 class="fw-bold">Success!</h3>
                <p class="text-muted px-4">
                    Your password has been successfully reset. You can now log in to your account using your new password.
                </p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-5 shadow-sm">Login Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
